services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cseheavens-app
    ports:
      - "3000:3000"
      - "3001:3000"
      - "3002:3000"
    env_file:
      - .env
    restart: always

# If you want to run a local MongoDB instance instead of Atlas, 
# you can uncomment the following lines and update your .env:
#   mongodb:
#     image: mongo:latest
#     container_name: cseheavens-db
#     ports:
#       - "27017:27017"
#     volumes:
#       - mongodb_data:/data/db

